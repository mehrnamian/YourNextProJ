name: scan-worker

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Non-sensitive identifier for this scan run
        required: true
        type: string
      installation_id:
        description: GitHub App installation ID
        required: true
        type: string

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run scan
        env:
          APP_ID: ${{ secrets.APP_ID }}
          PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          INSTALLATION_ID: ${{ inputs.installation_id }}
          SCAN_JOB_ID: ${{ inputs.job_id }}
        run: python -m spikes.stage1.run_scan
