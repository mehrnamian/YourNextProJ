[tool.pytest.ini_options]
testpaths = ["workers/analysis/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["workers.analysis"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
